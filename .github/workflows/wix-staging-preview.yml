name: Wix Staging Candidate Preview (No Release)

on:
  push:
    branches:
      - test/wix-staging-candidate-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: Build and preview on RentalFlow development site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      WIX_CLIENT_ID: 8ee574c2-70b9-45e9-98ed-9e8439a26e5d
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Verify app and set fixed staging target
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const c=JSON.parse(readFileSync('wix.config.json','utf8')); if (c.appId !== '8ee574c2-70b9-45e9-98ed-9e8439a26e5d' || c.namespace !== '@pilotedavid1/rental-flow') process.exit(1);"
          # Wix CLI reads this setting only from .env.local, not the CI process.
          printf 'WIX_SITE_ID=7f1ec6c8-4e35-4b19-a55d-21a9009e9386\n' > .env.local
          echo 'Target: existing RentalFlow development site only' >> "$GITHUB_STEP_SUMMARY"

      - name: Try isolated Wix build without login
        timeout-minutes: 5
        id: unauthenticated_build
        continue-on-error: true
        run: npm run build

      - name: Detect Wix CLI credentials
        id: credentials
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [[ -z "$WIX_API_KEY" ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::WIX_API_KEY is not configured. Authenticated Wix build and preview are blocked.'
            echo '### Wix preview blocked: configure GitHub Actions secret WIX_API_KEY' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Report isolated build outcome
        run: |
          echo "Unauthenticated Wix build: ${{ steps.unauthenticated_build.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'A green workflow does not prove a Wix preview was created: inspect the preview steps below.' >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate Wix CLI
        if: steps.credentials.outputs.available == 'true'
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: npx wix login --api-key "$WIX_API_KEY"

      - name: Pull Wix-managed environment and verify target
        if: steps.credentials.outputs.available == 'true'
        run: |
          npx wix env pull
          npx wix dev-site current | tee wix-site-selection.txt
          grep -Fq '7f1ec6c8-4e35-4b19-a55d-21a9009e9386' wix-site-selection.txt

      - name: Authenticated Wix production build (no deployment)
        if: steps.credentials.outputs.available == 'true'
        run: npm run build

      - name: Create isolated Wix preview (no app release)
        if: steps.credentials.outputs.available == 'true'
        timeout-minutes: 10
        run: |
          set -o pipefail
          npx wix preview | tee wix-preview-output.txt
          echo '### Wix preview command completed — check job logs for the Wix preview link' >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve preview logs
        if: steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rentalflow-staging-preview-details
          path: |
            wix-preview-output.txt
            wix-site-selection.txt
          if-no-files-found: ignore
          retention-days: 7
