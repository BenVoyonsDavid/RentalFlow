name: Validate RentalFlow

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WIX_CLIENT_ID: 8ee574c2-70b9-45e9-98ed-9e8439a26e5d
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Domain regression tests
        run: npm run test:domain

      - name: Booking design regression tests
        run: npm run test:booking-design

      - name: Security regression tests
        run: npm run test:security

      - name: Public booking journey regression tests
        run: npm run test:journey

      - name: Management UI regression tests
        run: npm run test:management-ui

      - name: Billing and App Market regression tests
        run: npm run test:billing

      - name: Staging payment consistency regression tests
        run: npm run test:staging-finance

      - name: App Market dashboard search and BI event checks
        run: npm run test:app-market

      - name: Wix build note
        run: echo "Wix build is validated locally after 'npx wix env pull'; CI cannot supply the Wix-managed instance environment."
